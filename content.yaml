  monogram: NX
  links:
    - label: GitHub
      url: https://github.com/na3th9n
    - label: LinkedIn
      url: https://www.linkedin.com/in/nathanxie/
    - label: Instagram
      url: https://www.instagram.com/yungnate02/
    - label: TikTok
      url: https://www.tiktok.com/@yungnate02
    - label: YouTube
